<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>For My Love</title>
  <meta name="description" content="A lovely digital card for you.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Caveat:wght@500;600&family=Inter:wght@300;400;500&family=Noto+Sans+Myanmar:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --envelope-back: #ffb3c6;
      --envelope-left: #ff8fab;
      --envelope-right: #ff8fab;
      --envelope-bottom: #fb6f92;
      --envelope-top: #ff758f;
      --bg: #fff0f3;
      --text: #590d22;
      --white: #fffdfc;
      --wax: #c1121f;
    }

    body {
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: var(--bg);
      background-image: radial-gradient(circle at center, #ffffff 0%, var(--bg) 100%);
      font-family: 'Inter', sans-serif;
      overflow: hidden;
    }

    #particles {
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      pointer-events: none;
      z-index: 0;
    }

    .particle {
      position: absolute;
      opacity: 0;
      animation: float 5s infinite;
      text-shadow: 0 0 10px rgba(255, 179, 198, 0.5);
    }

    @keyframes float {
      0% { transform: translateY(0) scale(0.5); opacity: 0; }
      20% { opacity: 0.8; }
      80% { opacity: 0.8; }
      100% { transform: translateY(-120px) scale(1.2) rotate(20deg); opacity: 0; }
    }

    .scene {
      position: relative;
      z-index: 10;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .envelope-wrapper {
      position: relative;
      width: 350px;
      height: 230px;
      cursor: pointer;
      perspective: 1000px;
    }

    .envelope {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 5px;
      box-shadow: 0 15px 40px rgba(251, 111, 146, 0.2);
      transition: transform 0.4s ease;
    }

    .envelope-wrapper:hover .envelope {
      transform: translateY(-8px);
      box-shadow: 0 25px 45px rgba(251, 111, 146, 0.3);
    }

    .envelope-back {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: var(--envelope-back);
      border-radius: 5px;
      z-index: 1;
    }

    .letter {
      position: absolute;
      bottom: 0;
      left: 5%;
      width: 90%;
      height: 90%;
      background: 
        radial-gradient(circle at top right, rgba(255, 182, 193, 0.3) 0%, transparent 50%),
        radial-gradient(circle at bottom left, rgba(255, 182, 193, 0.3) 0%, transparent 50%),
        linear-gradient(135deg, #fffdfc 0%, #ffe3ec 100%);
      border: 1px solid rgba(255, 179, 198, 0.6);
      border-radius: 8px 8px 2px 2px;
      z-index: 3;
      transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1), height 0.6s, z-index 0s 0.3s;
      padding: 35px 25px 25px 25px;
      box-sizing: border-box;
      text-align: center;
      box-shadow: inset 0 0 45px rgba(255, 182, 193, 0.3), 0 5px 15px rgba(0,0,0,0.06); 
      display: block;
      overflow: hidden;
    }

    .envelope-front {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 0;
      height: 0;
      border-left: 175px solid var(--envelope-left);
      border-right: 175px solid var(--envelope-right);
      border-bottom: 115px solid var(--envelope-bottom);
      border-top: 115px solid transparent;
      z-index: 4;
      pointer-events: none;
      border-radius: 0 0 5px 5px;
    }

    .envelope-flap {
      position: absolute;
      top: 0;
      left: 0;
      width: 0;
      height: 0;
      border-top: 130px solid var(--envelope-top);
      border-left: 175px solid transparent;
      border-right: 175px solid transparent;
      border-bottom: 100px solid transparent;
      z-index: 5;
      transform-origin: top;
      transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1), z-index 0s 0s;
    }

    .wax-seal {
      position: absolute;
      top: 130px;
      left: 175px;
      transform: translate(-50%, -50%);
      width: 55px;
      height: 55px;
      background: radial-gradient(circle, #e63946 0%, var(--wax) 100%);
      border-radius: 50%;
      z-index: 6;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15), inset 0 2px 4px rgba(255,255,255,0.3), inset 0 -2px 4px rgba(0,0,0,0.2);
      transition: all 0.4s ease;
    }

    .wax-seal::after {
      content: '♥';
      color: #780000;
      font-size: 26px;
      text-shadow: 0 1px 1px rgba(255,255,255,0.2);
    }

    .letter::before {
      content: '';
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      bottom: 10px;
      border: 1px solid #ffb3c6;
      border-radius: 4px;
      pointer-events: none;
      opacity: 0.8;
    }

    .letter::after {
      content: '';
      position: absolute;
      top: 15px;
      left: 15px;
      right: 15px;
      bottom: 15px;
      border: 1px dashed #ffb3c6;
      border-radius: 2px;
      pointer-events: none;
      opacity: 0.5;
    }

    .letter-title {
      position: relative;
      font-family: 'Dancing Script', cursive;
      font-size: 2.8rem;
      color: #c1121f;
      margin: 0;
      text-shadow: 1px 1px 2px rgba(193, 18, 31, 0.15); 
      display: inline-block;
      padding-bottom: 5px;
      border-bottom: 1px solid rgba(255, 179, 198, 0.7);
    }

    .letter-title::after {
      content: '❤';
      position: absolute;
      bottom: -13px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 1rem;
      color: #ffb3c6;
      background: #fffdfc;
      padding: 0 5px;
    }

    .letter-text {
      font-family: 'Noto Sans Myanmar', 'Caveat', sans-serif;
      font-size: 1.1rem;
      color: #4a2932;
      line-height: 1.6;
      margin: 15px 0 0 0;
      text-align: left;
      white-space: pre-wrap; 
      word-break: break-word;
      overflow-wrap: break-word;
      max-height: 220px;
      min-height: 120px; 
      position: relative;
      z-index: 10;
      overflow-y: auto;
      padding: 0 10px;
    }

    .letter-text::-webkit-scrollbar { width: 4px; }
    .letter-text::-webkit-scrollbar-track { background: transparent; }
    .letter-text::-webkit-scrollbar-thumb { background: rgba(255, 179, 198, 0.8); border-radius: 4px; }

    .letter-seal {
      margin-top: 20px;
      font-size: 1.4rem;
      color: var(--wax);
      font-family: 'Dancing Script', cursive;
      text-align: right;
      opacity: 0; 
      transition: opacity 1s ease;
      position: relative;
      z-index: 10;
    }

    .letter-seal.visible { opacity: 1; }

    .envelope-wrapper.open .envelope-flap {
      transform: rotateX(180deg);
      z-index: 2;
      transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1), z-index 0s 0.3s;
    }

    .envelope-wrapper.open .wax-seal { opacity: 0; transform: translate(-50%, 0) scale(0); }

    .envelope-wrapper.open .letter {
      transform: translateY(-90px);
      transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1) 0.4s, z-index 0s;
    }

    .envelope-wrapper.read .letter {
      height: 460px;
      transform: translateY(-30px) scale(1.05);
      z-index: 100;
      box-shadow: 0 20px 60px rgba(251, 111, 146, 0.3), 0 5px 20px rgba(0,0,0,0.15);
      transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1), height 0.6s, z-index 0s;
      cursor: auto;
    }

    .hint {
      position: absolute;
      bottom: -45px;
      width: 100%;
      text-align: center;
      color: var(--envelope-bottom);
      font-size: 0.95rem;
      font-weight: 500;
      opacity: 0.8;
      pointer-events: none;
      animation: pulse 2s infinite;
      transition: opacity 0.3s;
    }

    @keyframes pulse {
      0% { opacity: 0.6; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.02); }
      100% { opacity: 0.6; transform: scale(1); }
    }

    .scene::after {
      content: '🌹';
      position: absolute;
      bottom: -30px;
      right: -80px;
      font-size: 8rem;
      filter: drop-shadow(4px 15px 15px rgba(251, 111, 146, 0.3));
      z-index: 11;
      pointer-events: none;
      transform: rotate(15deg);
      transform-origin: bottom center;
      animation: sway 6s ease-in-out infinite;
    }

    @keyframes sway {
      0% { transform: rotate(15deg); }
      50% { transform: rotate(22deg); }
      100% { transform: rotate(15deg); }
    }

    @media screen and (max-width: 600px), screen and (max-height: 650px) { .scene { transform: scale(0.85); } }
    @media screen and (max-width: 500px), screen and (max-height: 550px) { .scene { transform: scale(0.75); } }
    @media screen and (max-width: 400px), screen and (max-height: 480px) { .scene { transform: scale(0.65); } }
    @media screen and (max-width: 320px), screen and (max-height: 400px) { .scene { transform: scale(0.55); } }
  </style>
</head>

<body>
  <audio id="bg-music" loop>
    <source id="music-src" src="music.mp3" type="audio/mpeg">
  </audio>

  <div id="particles"></div>
  <div class="scene">
    <div class="envelope-wrapper" id="envelope-wrapper">
      <div class="envelope">
        <div class="envelope-back"></div>

        <div class="letter" id="letter">
          <h1 class="letter-title" id="love-title">Ma Ma</h1>
          <div class="letter-text" id="typewriter-text"></div>
          <div class="letter-seal" id="love-seal">Forever Ma Ma ❤</div>
        </div>

        <div class="envelope-front"></div>
        <div class="envelope-flap"></div>
        <div class="wax-seal"></div>
      </div>
      <div class="hint" id="hints">ကျွန်တော့်ရင်ထဲကစကားလေးတွေကိုနားထောင်ပေးပါ</div>
    </div>
  </div>

  <script>
    // ⚙️ DYNAMIC CORE ENGINE INTERFACE
    const studioManifest = [
      { id: 'hints', type:'text', label: 'Intro',defaultValue:'ကျွန်တော့်ရင်ထဲကစကားလေးတွေကိုနားထောင်ပေးပါ'},
      { id: 'title', type: 'text', label: 'ချစ်ရသူအမည် (Header)', defaultValue: 'Ma Ma', icon: 'fa-solid fa-user-heart' },
      { id: 'message', type: 'textarea', label: 'ရင်ဖွင့်လွှာ စာသားများ', defaultValue: "မမကိုချစ်တယ်ဆိုတာထက် မြတ်နိုးတာပါမမရယ်\nတကယ်တော့ကျွန်တော်က မ့ထက်အသက်ငယ်ပေမယ့် မမအတွက်ဆိုရင်ရည်မှန်းချက်တွေနဲ့ပြည့်နှက်နေတာပါ\nကျွန်တော်ချစ်ရတဲ့မကို တစ်ရက်လောက်စောပြီးတွေ့ခွင့်ရရင် အရမ်းကောင်းမှာပဲမရယ်\nတကယ်တော့ကျွန်တော်က မကိုဘယ်သူနဲ့မှယှခဲ့တာမဟုတ်ပါဘူး\nမမက ကျွန်တော့်အတွက်အကောင်းဆုံးနဲ့အဖိုးတန်ဆုံးပါ\nအဲ့ဒါကြောင့်မမကို ကျွန်တော့်ဘက်ကိုစိတ်ယိုင်ပေးပါလားမမရယ်", icon: 'fa-solid fa-envelope-open-text' },
      { id: 'sealText', type: 'text', label: 'အဆုံးသတ်လက်မှတ်', defaultValue: 'Forever Ma Ma ❤', icon: 'fa-solid fa-signature' },
      { id: 'bgMusic', type: 'audio', label: 'နောက်ခံတေးဂီတ (MP3)', defaultValue: 'music.mp3', icon: 'fa-solid fa-music' }
    ];

    let dynamicState = {};
    studioManifest.forEach(f => dynamicState[f.id] = f.defaultValue);

    // Parent Studio ထံသို့ ရရှိနိုင်သော Form Schema စာရင်း ပေးပို့ခြင်း
    function registerWithStudio() {
      window.parent.postMessage({ type: 'REGISTER_MANIFEST', schema: studioManifest }, '*');
    }
    setTimeout(registerWithStudio, 300);

    // URL Payload သို့မဟုတ် Form ထံမှ ဒေတာအပြောင်းအလဲများအား ဖတ်ယူသတ်မှတ်ခြင်း
    function applyStateUpdate(payload) {
      if(!payload) return;
      dynamicState = { ...dynamicState, ...payload };

      document.getElementById('hints').innerText = dynamicState.hints;
      
      document.getElementById('love-title').innerText = dynamicState.title;
      document.getElementById('love-seal').innerText = dynamicState.sealText;
      
      // သီချင်းဖိုင် ပြောင်းလဲပါက Audio Source အသစ်လဲခြင်း
      if(dynamicState.bgMusic && dynamicState.bgMusic !== 'music.mp3') {
        const audio = document.getElementById('bg-music');
        const src = document.getElementById('music-src');
        if(src.src !== dynamicState.bgMusic) {
          src.src = dynamicState.bgMusic;
          audio.load();
        }
      }
    }

    // URL Query String မှ သယ်ဆောင်လာသော Payload ရှိမရှိ စစ်ဆေးခြင်း
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.has('studio_payload')) {
      try {
        const decoded = JSON.parse(decodeURIComponent(escape(atob(urlParams.get('studio_payload')))));
        applyStateUpdate(decoded);
      } catch(e) { console.error("Payload decoding failed", e); }
    }

    // Live Message Receiver from Studio Form Panel
    window.addEventListener('message', function(event) {
      if (!event.data) return;
      if (event.data.type === 'UPDATE_DATA') {
        applyStateUpdate(event.data.payload);
      }
      if (event.data.type === 'REQUEST_SNAPSHOT') {
        window.parent.postMessage({ type: 'HTML_SNAPSHOT', html: document.documentElement.outerHTML }, '*');
      }
    });

    // 💌 LETTER ANIMATION INTERACTION
    document.addEventListener("DOMContentLoaded", () => {
      const envelopeWrapper = document.getElementById('envelope-wrapper');
      const hint = document.getElementById('hint');
      const bgMusic = document.getElementById('bg-music');

      let isOpen = false;
      let isRead = false;
      let isTyping = false;
      let hasTyped = false;

      envelopeWrapper.addEventListener('click', (e) => {
        if (!isOpen) {
          if (bgMusic && bgMusic.paused) {
            bgMusic.play().catch(err => console.log("Audio play failed:", err));
          }

          envelopeWrapper.classList.add('open');
          isOpen = true;
          hint.style.opacity = '0';
          spawnPopHearts(e.clientX, e.clientY);

          setTimeout(() => {
            if (isOpen) {
              envelopeWrapper.classList.add('read');
              isRead = true;

              if (!hasTyped && !isTyping) {
                isTyping = true;
                setTimeout(() => typeWriterEffect(dynamicState.message, document.getElementById('typewriter-text')), 600);
              }
            }
          }, 600);
        } else if (isRead) {
          envelopeWrapper.classList.remove('read');
          envelopeWrapper.classList.remove('open');
          isOpen = false;
          isRead = false;
          hint.style.opacity = '1';
        }
      });

      function typeWriterEffect(text, element, speed = 60) {
        let i = 0;
        element.textContent = '';
        function type() {
          if (i < text.length) {
            element.textContent += text.charAt(i);
            i++;
            setTimeout(type, speed + (Math.random() * 40 - 20));
          } else {
            isTyping = false;
            hasTyped = true;
            document.getElementById('love-seal').classList.add('visible');
          }
        }
        type();
      }

      createBackgroundParticles();
    });

    function createBackgroundParticles() {
      const container = document.getElementById('particles');
      const symbols = ['❤', '✨', '⭐', '💖'];
      for (let i = 0; i < 25; i++) {
        setTimeout(() => {
          const particle = document.createElement('div');
          particle.className = 'particle';
          particle.textContent = symbols[Math.floor(Math.random() * symbols.length)];
          particle.style.left = Math.random() * 100 + 'vw';
          particle.style.top = Math.random() * 100 + 'vh';
          particle.style.fontSize = Math.random() * 18 + 12 + 'px';
          particle.style.color = Math.random() > 0.5 ? '#ffb3c6' : '#ff8fab';
          particle.style.animation = `float ${Math.random() * 4 + 5}s infinite linear`;
          particle.style.animationDelay = `-${Math.random() * 5}s`;
          container.appendChild(particle);
        }, i * 250);
      }
    }

    function spawnPopHearts(x, y) {
      for (let i = 0; i < 8; i++) {
        const heart = document.createElement('div');
        heart.innerHTML = '❤';
        heart.style.position = 'absolute';
        heart.style.left = x + 'px';
        heart.style.top = y + 'px';
        heart.style.color = '#c1121f';
        heart.style.fontSize = (Math.random() * 15 + 15) + 'px';
        heart.style.pointerEvents = 'none';
        heart.style.zIndex = '1000';
        heart.style.transition = 'all 0.8s cubic-bezier(0.25, 1, 0.5, 1)';
        document.body.appendChild(heart);

        requestAnimationFrame(() => {
          requestAnimationFrame(() => {
            const angle = Math.random() * Math.PI * 2;
            const distance = Math.random() * 80 + 40;
            heart.style.transform = `translate(${Math.cos(angle) * distance}px, ${Math.sin(angle) * distance - 50}px) scale(0)`;
            heart.style.opacity = '0';
          });
        });
        setTimeout(() => heart.remove(), 1000);
      }
    }
  </script>
</body>
</html>
